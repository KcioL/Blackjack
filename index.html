<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÉCRAN DE SALON (LOBBY) -->
  <div id="lobby-screen" class="lobby-screen">
    <div class="lobby-box">
      <h1>Blackjack </h1>
      
      <label>
        Votre Pseudo :
        <input type="text" id="lobby-name" maxlength="15" placeholder="Ex : Johnny Sins" value="">
      </label>
      
      <div class="lobby-actions" style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
        <!-- Zone Création -->
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #444;">
          <label style="margin-bottom: 10px;">
            Créer un salon (1 à 4 joueurs) :
            <input type="number" id="lobby-num-players" min="1" max="4" value="2">
          </label>
          <button id="btn-create-room" class="btn btn-start" style="width: 100%;">Créer la partie</button>
        </div>

        <!-- Zone Rejoindre -->
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #444;">
          <label style="margin-bottom: 10px;">
            Rejoindre un salon :
            <input type="text" id="lobby-code" maxlength="6" placeholder="CODE" style="text-transform: uppercase;">
          </label>
          <button id="btn-join-room" class="btn btn-secondary" style="width: 100%;">Rejoindre</button>
        </div>
      </div>

      <p id="lobby-error" class="hidden" style="color: #e74c3c; margin: 0; font-weight: bold;"></p>
    </div>
  </div>

  <!-- ÉCRAN DE JEU (Caché par défaut) -->
  <div id="game-screen" class="game-container hidden">
    <header class="game-header">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <h1>Blackjack</h1>
        <span style="color: #ffd700; font-weight: bold; font-size: 0.9rem;">Salon : <span id="display-room-code">----</span></span>
      </div>
    </header>

    <div class="casino-table">
      <!-- Zone Croupier -->
      <div class="player-zone dealer-zone">
        <div class="player-info">
          <span class="player-name">Croupier</span>
          <span class="player-chips">Score: <span id="dealer-score">?</span></span>
        </div>
        <div class="cards-container" id="dealer-cards"></div>
      </div>

      <!-- Zone Centrale -->
      <div class="center-zone">
        <div class="game-message" id="game-message">En attente de joueurs...</div>
      </div>

      <!-- Zones des joueurs (Générées par JS) -->
      <div class="players-container" id="players-container"></div>
    </div>

    <!-- Contrôles Actions -->
    <div class="controls">
      <button id="btn-start" class="btn btn-start hidden">Lancer la partie</button>
      
      <div id="betting-controls" class="action-buttons hidden">
        <label id="bet-label" style="color: #ffd700; font-weight: bold; margin-right: 10px;">Mise (€) :
          <input type="number" id="bet-input" min="10" step="10" value="50" style="width: 70px; padding: 5px; border-radius: 5px; background: #2a2a2a; color: white; border: 1px solid #444;">
        </label>
        <button id="btn-bet" class="btn btn-start">Valider la mise</button>
        <button id="btn-reload" class="btn btn-secondary hidden">Recharger (+1000€)</button>
      </div>

      <div id="action-buttons" class="action-buttons hidden">
        <button id="btn-hit" class="btn btn-secondary">Tirer (Hit)</button>
        <button id="btn-stand" class="btn btn-danger">Rester (Stand)</button>
        <!-- NOUVEAU BOUTON DOUBLE -->
        <button id="btn-double" class="btn btn-secondary hidden" style="background-color: #27ae60;">Doubler (Double)</button>
        <!-- NOUVEAU BOUTON SPLIT -->
        <button id="btn-split" class="btn btn-secondary hidden" style="background-color: #8e44ad;">Séparer (Split)</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
